apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-v1
  template:
    metadata:
      labels:
        app: inventory-v1
    spec:
      containers:
      - name: inventory
        image: bhxrxth0409/inventory-system:v1
        ports:
        - containerPort: 5000